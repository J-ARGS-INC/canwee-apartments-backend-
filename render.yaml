services:
  - type: web
    name: canwee-apartments-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: https://canweeapartments.com,https://www.canweeapartments.com
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: 5432
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        value: postgres
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: support@canweeapartments.com
      - key: BREVO_FROM_NAME
        value: Canwee Apartments
      - key: NOTIFY_EMAILS
        value: support@canweeapartments.com,jargsltd@gmail.com
      - key: FRONTEND_URL
        value: https://canweeapartments.com
      - key: ADMIN_DASHBOARD_URL
        value: https://canweeapartments.com/2889bc29ed60/admin
